name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Two kinds of file are left out, both for the same reason: a test of them
      # would be a test of something other than this project.
      #
      # The `main.rs` of each binary is argument parsing and wiring, exercised by
      # running the binaries rather than by unit tests. Logic worth testing is
      # expected to live in the crate's library instead, so anything substantial
      # appearing in one of these is a sign it is in the wrong place.
      #
      # `core/src/remote.rs` is the half of the client that talks to GitHub. Its
      # connector is https-only, so it cannot be pointed at a local server, and a
      # test of it would be a test of the network. Everything it does with what
      # comes back lives in `core/src/client.rs`, which is measured.
      - run: cargo llvm-cov --workspace --ignore-filename-regex '((server|daemon|collect)/src/main\.rs|core/src/remote\.rs)' --fail-under-lines 85

name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # The `main.rs` of each binary is argument parsing and wiring, exercised by
      # running the binaries rather than by unit tests. Logic worth testing is
      # expected to live in the crate's library instead, so anything substantial
      # appearing in one of these is a sign it is in the wrong place.
      - run: cargo llvm-cov --workspace --ignore-filename-regex '(server|daemon|collect)/src/main\.rs' --fail-under-lines 85

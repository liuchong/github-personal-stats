[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/collect",
    "crates/daemon",
    "crates/server",
]
resolver = "3"

[workspace.package]
authors = ["Liu Chong <mail@liuchong.dev>"]
edition = "2024"
homepage = "https://github.com/liuchong/github-personal-stats"
keywords = ["github", "svg", "statistics", "profile", "readme"]
license-file = "LICENSE"
repository = "https://github.com/liuchong/github-personal-stats"
rust-version = "1.85"
version = "1.5.1"

[workspace.dependencies]
github-personal-stats-collect = { path = "crates/collect", version = "1.5.1" }
github-personal-stats-core = { path = "crates/core", version = "1.5.1" }
